<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar acesso · SGCI</title>

    <meta name="color-scheme" content="dark light">
    <script>try { var t = localStorage.getItem('sgci-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; if (localStorage.getItem('sgci-densidade') === 'bancada') document.documentElement.dataset.densidade = 'bancada'; } catch (e) {}</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="css/global.css?v=7">
    <link rel="stylesheet" href="css/layout.css?v=7">
    <link rel="stylesheet" href="css/components.css?v=7">
</head>
<body>
    <main class="auth-single">
        <section class="auth-panel login-card">
            <div class="auth-brand">
                <span class="brand-glyph" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6.34L4.24 17.5A2 2 0 0 0 6 20.5h12a2 2 0 0 0 1.76-3L15 8.34V2"/><path d="M8.5 2h7"/><path d="M6.5 14.5h11"/></svg></span>
                <span class="brand-mark">SGCI / GMAE</span>
            </div>
            <h1>Solicitar acesso</h1>
            <p class="lede">Depois de enviar, confirme o e-mail e aguarde a aprovação.</p>

            <form id="register-form" aria-label="Formulário de Solicitação de Registro">
                <div class="input-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" required autocomplete="name">
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" required autocomplete="new-password">
                        <button type="button" class="password-toggle" data-target="password" aria-label="Mostrar senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
                    <span class="help">8 ou mais caracteres, com uma maiúscula, um número e um símbolo.</span>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirmar senha</label>
                    <div class="password-field">
                        <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password">
                        <button type="button" class="password-toggle" data-target="confirm-password" aria-label="Mostrar senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
                </div>

                <div id="register-feedback" class="feedback-msg" aria-live="polite"></div>

                <button type="submit" id="btn-register" class="btn btn-primary btn-block">
                    <span class="btn-text">Enviar solicitação</span>
                    <span class="spinner hidden" aria-hidden="true"></span>
                </button>
            </form>

            <p class="auth-foot">Já tem conta? <a href="index.html" id="link-login">Entrar</a></p>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/salvaguardas.js?v=1"></script>
    <script src="js/register.js"></script>
</body>
</html>
