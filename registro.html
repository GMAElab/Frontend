<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar acesso · SGCI / GMAE</title>

    <meta name="color-scheme" content="dark light">
    <script>try { var t = localStorage.getItem('sgci-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; if (localStorage.getItem('sgci-densidade') === 'bancada') document.documentElement.dataset.densidade = 'bancada'; } catch (e) {}</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="css/global.css?v=10">
    <link rel="stylesheet" href="css/layout.css?v=10">
    <link rel="stylesheet" href="css/components.css?v=10">
</head>
<body>
    <main class="auth-shell">
        <div class="auth-topbar">
            <button type="button" class="theme-toggle" id="auth-theme-btn" aria-label="Alternar tema claro/escuro" title="Alternar tema claro/escuro">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            </button>
        </div>

        <div class="auth-container">
            <header class="auth-hero-brand">
                <div class="auth-logo-mark" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6.34L4.24 17.5A2 2 0 0 0 6 20.5h12a2 2 0 0 0 1.76-3L15 8.34V2"/><path d="M8.5 2h7"/><path d="M6.5 14.5h11"/></svg>
                </div>
                <span class="auth-badge-pill"><span class="dot"></span>SGCI · GMAE / LEQM</span>
            </header>

            <section class="auth-panel login-card">
                <nav class="auth-switcher" aria-label="Modo de acesso">
                    <a href="index.html" class="auth-switch-btn">Entrar</a>
                    <a href="registro.html" class="auth-switch-btn active" aria-current="page">Solicitar acesso</a>
                </nav>

                <h1>Criar conta no laboratório</h1>
                <p class="lede">Após enviar, confirme seu e-mail e aguarde a liberação da coordenação.</p>

                <form id="register-form" aria-label="Formulário de Solicitação de Registro">
                    <div class="input-group">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" required autocomplete="name" placeholder="Seu nome e sobrenome">
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail institucional</label>
                        <input type="email" id="email" name="email" required autocomplete="email" placeholder="seu.email@instituicao.br">
                    </div>

                    <div class="input-group">
                        <label for="password">Senha</label>
                        <div class="password-field">
                            <input type="password" id="password" name="password" required autocomplete="new-password">
                            <button type="button" class="password-toggle" data-target="password" aria-label="Mostrar senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                        </div>
                        <span class="help">Mínimo de 8 caracteres, com maiúscula, número e símbolo.</span>
                    </div>

                    <div class="input-group">
                        <label for="confirm-password">Confirmar senha</label>
                        <div class="password-field">
                            <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password" placeholder="Repita a senha">
                            <button type="button" class="password-toggle" data-target="confirm-password" aria-label="Mostrar senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                        </div>
                    </div>

                    <div id="register-feedback" class="feedback-msg" aria-live="polite"></div>

                    <button type="submit" id="btn-register" class="btn btn-primary btn-block">
                        <span class="btn-text">Enviar solicitação</span>
                        <span class="spinner hidden" aria-hidden="true"></span>
                    </button>
                </form>

                <p class="auth-foot">Já possui uma conta ativa? <a href="index.html" id="link-login">Entrar no portal</a></p>
            </section>

            <p class="auth-meta-footer">Sistema de Gestão do Conhecimento e Inovação · GMAE</p>
        </div>
    </main>

    <script src="js/api.js?v=4"></script>
    <script src="js/ui.js?v=3400"></script>
    <script src="js/salvaguardas.js?v=2"></script>
    <script src="js/register.js?v=2"></script>
    <script>
        document.getElementById('auth-theme-btn')?.addEventListener('click', function () {
            var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
            document.documentElement.dataset.theme = next;
            try { localStorage.setItem('sgci-theme', next); } catch (e) {}
        });
    </script>
</body>
</html>
