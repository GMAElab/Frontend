<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar e-mail · SGCI</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <main class="auth-single">
        <section class="auth-panel">
            <p class="eyebrow">SGCI / GMAE</p>
            <h1>Confirmação de e-mail</h1>

            <div id="verificacao-spinner" class="loading">
                <span class="spinner"></span> Confirmando seu e-mail...
            </div>

            <div id="verificacao-resultado" class="hidden">
                <p id="verificacao-mensagem" class="feedback-msg mt-md" aria-live="polite"></p>
                <a href="index.html" class="btn btn-primary">Ir para o login</a>
            </div>
        </section>
    </main>

    <script>
        (async function () {
            const API_URL = 'https://api-hzrz.onrender.com';
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            const spinner = document.getElementById('verificacao-spinner');
            const resultado = document.getElementById('verificacao-resultado');
            const mensagem = document.getElementById('verificacao-mensagem');

            function mostrarResultado(texto, sucesso) {
                spinner.classList.add('hidden');
                resultado.classList.remove('hidden');
                mensagem.textContent = texto;
                mensagem.className = `feedback-msg ${sucesso ? 'success' : 'error'}`;
            }

            if (!token) {
                mostrarResultado('Link de confirmação inválido: token ausente.', false);
                return;
            }

            try {
                const res = await fetch(`${API_URL}/verificar-email?token=${encodeURIComponent(token)}`, { method: 'GET' });
                const data = await res.json().catch(() => ({}));

                if (res.ok) {
                    mostrarResultado(data.mensagem || 'E-mail confirmado com sucesso!', true);
                } else {
                    mostrarResultado(data.detail || 'Não foi possível confirmar seu e-mail.', false);
                }
            } catch (err) {
                mostrarResultado('Erro de conexão. Tente novamente em instantes.', false);
            }
        })();
    </script>
</body>
</html>
