<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar e-mail · SGCI</title>

    <meta name="color-scheme" content="dark light">
    <script>try { var t = localStorage.getItem('sgci-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; if (localStorage.getItem('sgci-densidade') === 'bancada') document.documentElement.dataset.densidade = 'bancada'; } catch (e) {}</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="css/global.css?v=7">
    <link rel="stylesheet" href="css/layout.css?v=7">
    <link rel="stylesheet" href="css/components.css?v=7">
</head>
<body>
    <main class="auth-single">
        <section class="auth-panel">
            <div class="auth-brand">
                <span class="brand-glyph" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6.34L4.24 17.5A2 2 0 0 0 6 20.5h12a2 2 0 0 0 1.76-3L15 8.34V2"/><path d="M8.5 2h7"/><path d="M6.5 14.5h11"/></svg></span>
                <span class="brand-mark">SGCI / GMAE</span>
            </div>
            <h1>Confirmação de e-mail</h1>

            <div id="verificacao-spinner" class="loading">
                <span class="spinner"></span> Confirmando seu e-mail...
            </div>

            <div id="verificacao-resultado" class="hidden">
                <p id="verificacao-mensagem" class="feedback-msg mt-md" aria-live="polite"></p>
                <a href="index.html" class="btn btn-primary">Ir para o login</a>
            </div>
        </section>
    </main>

    <script>
        (async function () {
            const API_URL = 'https://api-hzrz.onrender.com';
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            const spinner = document.getElementById('verificacao-spinner');
            const resultado = document.getElementById('verificacao-resultado');
            const mensagem = document.getElementById('verificacao-mensagem');

            function mostrarResultado(texto, sucesso) {
                spinner.classList.add('hidden');
                resultado.classList.remove('hidden');
                mensagem.textContent = texto;
                mensagem.className = `feedback-msg ${sucesso ? 'success' : 'error'}`;
            }

            if (!token) {
                mostrarResultado('Link de confirmação inválido: token ausente.', false);
                return;
            }

            try {
                const res = await fetch(`${API_URL}/verificar-email?token=${encodeURIComponent(token)}`, { method: 'GET' });
                const data = await res.json().catch(() => ({}));

                if (res.ok) {
                    mostrarResultado(data.mensagem || 'E-mail confirmado com sucesso!', true);
                } else {
                    mostrarResultado(data.detail || 'Não foi possível confirmar seu e-mail.', false);
                }
            } catch (err) {
                mostrarResultado('Erro de conexão. Tente novamente em instantes.', false);
            }
        })();
    </script>
</body>
</html>
